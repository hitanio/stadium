<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ことばワールドカップ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--g1:#0b6b3a;--g2:#0f8a4b;--navy:#0c1b33;--gold:#ffc83d;--red:#e5484d;--ink:#13213a;--card:#fff;--mut:#6b778c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"M PLUS Rounded 1c",system-ui,sans-serif;background:var(--navy);color:var(--ink);font-weight:500}
.screen{display:none;min-height:100%;max-width:520px;margin:0 auto;padding:14px 14px 28px}
.screen.on{display:block}
h1{color:#fff;font-size:22px;margin:4px 0 12px;font-weight:800;letter-spacing:.02em}
h1 small{display:block;font-size:12px;color:#9fb0cc;font-weight:500;margin-top:2px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.team{display:flex;align-items:center;gap:10px}
.team input{font:inherit;font-weight:800;font-size:17px;border:none;border-bottom:2px dashed #ccd;width:100%;padding:2px 0;color:var(--ink);background:transparent}
.crestbtn{border:none;background:none;padding:0;cursor:pointer;position:relative}
.crestbtn:after{content:"✎";position:absolute;right:-4px;bottom:-2px;font-size:11px;background:var(--gold);border-radius:50%;width:16px;height:16px;line-height:16px;text-align:center;color:#3a2a00}
.rankbig{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.rankbig b{font-size:40px;font-weight:800;color:var(--g1)}
.mut{color:var(--mut);font-size:13px}
.vs{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.vs .mut{color:#cfe9d9}
.opp{display:flex;align-items:center;gap:12px;margin-top:6px}
.flag{font-size:40px;line-height:1}
.crest{display:inline-block;line-height:0}.crest svg{display:block}
.lvtag{display:inline-block;background:#1d4ed8;color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800}
.stat{display:flex;justify-content:center;gap:14px;margin-top:8px;font-size:14px}.stat b{font-size:18px}
.oname{font-size:20px;font-weight:800}
.stars{color:var(--gold);letter-spacing:2px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.btn{font:inherit;font-weight:800;border:none;border-radius:12px;padding:10px 14px;background:#e9eef6;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--gold);color:#3a2a00}
.btn.sm{padding:6px 10px;font-size:13px}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:#cfe9d9}
.grade{color:#fff;font-weight:800;margin:16px 2px 8px;font-size:15px}
.stage{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;border:none;width:100%;text-align:left;font:inherit}
.stage .no{width:34px;height:34px;border-radius:50%;background:var(--g2);color:#fff;font-weight:800;display:grid;place-items:center;flex:none}
.stage .t{flex:1}
.stage .t b{display:block;font-size:15px}
.stage .st{font-size:12px;color:var(--mut)}
.stage.lock{opacity:.45;cursor:not-allowed}
.stage.lock .no{background:#99a}
.stage.done .no{background:var(--gold);color:#3a2a00}
.stage.fin .no{background:#7c3aed}
/* match */
.board{background:#0a1426;color:#fff;border-radius:16px;padding:10px 12px;position:sticky;top:6px;z-index:5;box-shadow:0 6px 16px #0006}
.sc{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
.sc .nm{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .fl{font-size:28px;display:flex;justify-content:center}
.sc .num{font-size:34px;font-weight:800;letter-spacing:4px}
.half{text-align:center;font-size:12px;color:#9fb0cc;margin-top:2px}
.pitch{position:relative;height:26px;margin-top:6px;border-radius:8px;background:repeating-linear-gradient(90deg,#127a41 0 28px,#0f6e3a 28px 56px);overflow:hidden}
.pitch:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #ffffff66}
.goalL,.goalR{position:absolute;top:6px;bottom:6px;width:6px;background:#fff}
.goalL{left:0}.goalR{right:0}
.ball{position:absolute;top:50%;left:50%;font-size:17px;transform:translate(-50%,-50%);transition:left .6s cubic-bezier(.3,.8,.4,1)}
.dots{display:flex;gap:5px;justify-content:center;margin-top:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:#2a3a58}
.dots i.ok{background:#3ddc84}.dots i.ng{background:var(--red)}.dots i.now{background:#fff}
.timer{height:8px;background:#2a3a58;border-radius:4px;margin-top:8px;overflow:hidden}
.timer div{height:100%;background:var(--gold);width:100%}
.timer div.low{background:var(--red)}
.qcard{background:#fff;border-radius:16px;padding:14px 12px;margin-top:12px}
.qlab{font-size:12px;color:var(--mut);text-align:center}
.qtag{display:inline-block;background:#fff3c4;color:#7a5a00;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:800;margin-left:4px}
.psg{background:#f6f8fc;border-left:4px solid var(--g2);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:15px;line-height:1.85;white-space:pre-wrap}
.q{font-size:19px;font-weight:800;margin:10px 0 2px;line-height:1.6;text-align:center}
.q .bigk{font-size:40px;display:block;letter-spacing:.08em;line-height:1.3}
.mk{color:var(--g1);border-bottom:3px solid var(--g2);padding:0 2px}
.hint{font-size:13px;color:var(--mut);min-height:16px;margin-top:6px;text-align:center}
.hint.exp{color:var(--ink);background:#f1f5fb;border-radius:8px;padding:8px;text-align:left}
.comm{color:#fff;text-align:center;font-weight:800;min-height:24px;margin-top:10px;font-size:16px}
.choices{display:grid;gap:8px;margin-top:10px}
.choices button{font:inherit;font-weight:800;font-size:17px;padding:12px;border-radius:12px;border:2px solid transparent;background:#fff;color:var(--ink);text-align:left;display:flex;gap:10px;align-items:center;cursor:pointer;line-height:1.45}
.choices.kanji button{font-size:26px;justify-content:center}
.choices.kanji{grid-template-columns:1fr 1fr}
.choices button .k{flex:none;width:24px;height:24px;border-radius:50%;background:#e9eef6;display:grid;place-items:center;font-size:13px;color:var(--mut)}
.choices.kanji button .k{display:none}
.choices button:active{transform:scale(.98)}
.choices button.right{background:#3ddc84;color:#06361c}
.choices button.wrong{background:var(--red);color:#fff}
.choices button.dim{opacity:.55}
.nextbtn{font:inherit;font-weight:800;font-size:20px;border:none;border-radius:12px;padding:12px;background:var(--gold);color:#3a2a00;width:100%;margin-top:10px;cursor:pointer}
.over{position:fixed;inset:0;background:#0c1b33dd;display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
.over.on{display:flex}
.over .box{background:#fff;border-radius:18px;padding:20px;max-width:420px;width:100%;text-align:center;max-height:90vh;overflow:auto}
.goaltxt{position:fixed;left:0;right:0;top:38%;text-align:center;font-size:56px;font-weight:800;color:var(--gold);text-shadow:0 4px 0 #0008;pointer-events:none;opacity:0;z-index:8}
.goaltxt.go{animation:gl 1s ease-out}
@keyframes gl{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.res h2{margin:0 0 4px;font-size:26px}
.big{font-size:44px;font-weight:800;margin:4px 0}
.delta{font-size:18px;font-weight:800}
.up{color:var(--g2)}.down{color:var(--red)}
.miss{text-align:left;margin-top:10px;font-size:14px}
.miss>div{padding:8px 0;border-bottom:1px solid #eef;line-height:1.6}
.miss .ma{color:var(--g1);font-weight:800}
.miss .me{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 6px;border-bottom:1px solid #eef}
td.r{width:40px;text-align:right;font-weight:800;color:var(--mut)}
td.p{text-align:right;color:var(--mut);font-size:12px}
tr.me td{background:#fff3c4;font-weight:800}
.note{color:#9fb0cc;font-size:11px;margin-top:12px;line-height:1.6}
.sw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 12px}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ccd;cursor:pointer}
.sw button.sel{box-shadow:0 0 0 3px var(--ink)}
.cfield{font:inherit;font-weight:800;font-size:18px;text-align:center;border:2px solid #dde;border-radius:10px;padding:6px;width:120px}
.timer{display:none}
</style>

<body>

<!-- HOME -->
<section id="home" class="screen on">
  <a href="../index.html" class="hubback" style="display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#0c1b33;font-size:18px;font-weight:800;text-decoration:none;padding:14px 16px;border-radius:14px;margin-bottom:12px;box-shadow:0 3px 0 #0006">🏟️ スタジアム入口へもどる</a>
  <h1>⚽ ことばワールドカップ<small>小3〜小4の国語で、世界ランキング1位をめざせ！</small></h1>
  <div class="card">
    <div class="team"><button class="crestbtn" id="crestHome" onclick="openCrest()" aria-label="エンブレムを変える"></button><input id="tname" maxlength="12" aria-label="チーム名"></div>
    <div class="rankbig"><span class="mut">世界ランキング</span><b id="myRank">-</b><span class="mut" id="myPts"></span></div>
    <div class="row" style="margin-top:6px"><span class="mut" id="clearInfo"></span><button class="btn sm" onclick="showRanking()">ランキング表</button></div>
  </div>
  <div class="card vs">
    <div class="row"><span style="font-weight:800">つぎの対戦あいて</span><input type="checkbox" id="slow" hidden></div>
    <div class="opp"><span class="flag" id="oFlag"></span><div><div class="oname" id="oName"></div><div class="mut"><span id="oRank"></span>　<span class="stars" id="oStars"></span></div><div class="mut" id="oTime"></div></div></div>
    <div class="mut" style="margin-top:8px">ステージをえらんでキックオフ。4つの中から正しいものをえらぼう。どのステージにも、ことわざ・四字熟語がまざって出てくるよ。</div>
  </div>
  <div id="stages"></div>
  <div class="row" style="margin-top:14px"><span></span><button class="btn sm" onclick="resetAll()">さいしょからやり直す</button></div>
  <div class="note">ランキングは FIFA/Coca-Cola 男子世界ランキング（2026年11月18日発表）をもとにしています。21位以下の順位とポイントの一部は概算です。</div>
</section>

<!-- MATCH -->
<section id="match" class="screen">
  <div class="board">
    <div class="sc">
      <div><div class="fl" id="crestMatch"></div><div class="nm" id="mMy"></div></div>
      <div class="num"><span id="sMy">0</span>-<span id="sOp">0</span></div>
      <div><div class="fl" id="mOpF"></div><div class="nm" id="mOp"></div></div>
    </div>
    <div class="half" id="halfLab"></div>
    <div class="pitch"><div class="goalL"></div><div class="goalR"></div><div class="ball" id="ball">⚽</div></div>
    <div class="dots" id="dots"></div>
    <div class="timer"><div id="tbar"></div></div>
  </div>
  <div class="qcard">
    <div class="qlab" id="qlab"></div>
    <div id="psg"></div>
    <div class="q" id="q"></div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="comm" id="comm"></div>
  <div class="choices" id="choices"></div>
  <div style="text-align:center;margin-top:14px"><button class="btn sm" onclick="quitMatch()">試合をやめる</button></div>
</section>

<!-- RESULT -->
<section id="result" class="screen">
  <div class="card res" id="resBox"></div>
  <button class="btn pri" style="width:100%;padding:14px" onclick="goHome()">ホームへ</button>
</section>

<!-- RANKING -->
<section id="ranking" class="screen">
  <h1>🌍 世界ランキング<small>あなたのチームが入ったランキング</small></h1>
  <div class="card" style="padding:6px 10px"><table id="rtable"></table></div>
  <button class="btn pri" style="width:100%;padding:14px" onclick="goHome()">もどる</button>
</section>

<div class="over" id="over"><div class="box" id="overBox"></div></div>
<div class="goaltxt" id="goaltxt">GOAL!!</div>

<script>
/* ===== クラウド保存（アカウントにセーブを保管し、ブラウザの記録が消えても復元） ===== */
(function(){
 const KEYS=['calcWC_v1','kotobaWC_v1','eigoWC_v1','wcHub_v1'],TK='wcSyncT_v1';
 const P=Storage.prototype,orig=P.setItem;let ready=false,timer=null,ref=null;
 const getT=()=>{try{return JSON.parse(localStorage.getItem(TK))||{}}catch(e){return {}}};
 const setT=t=>{try{orig.call(localStorage,TK,JSON.stringify(t))}catch(e){}};
 P.setItem=function(k,v){orig.call(this,k,v);if(ready&&this===window.localStorage&&KEYS.includes(k)){const t=getT();t[k]=Date.now();setT(t);push()}};
 function push(){clearTimeout(timer);timer=setTimeout(async()=>{if(!ref)return;try{const t=getT(),d={t:{}};KEYS.forEach(k=>{const v=localStorage.getItem(k);if(v!=null){d[k]=v;d.t[k]=t[k]||0}});await ref.set(d)}catch(e){}},1500)}
 async function start(){
  for(let i=0;i<100&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
  if(!(window.claude&&window.claude.use))return;
  try{
   const db=await window.claude.use('db'),user=await window.claude.use('user');if(!db||!user)return;
   const id=await user.id();if(!id)return;
   ref=db.doc('data/users/'+id+'/save');
   const snap=await ref.get();const rd=snap&&(typeof snap.data==='function'?snap.data():(snap.data||snap))||null;
   const t=getT();let restored=false,needPush=false;
   KEYS.forEach(k=>{const rt=rd&&rd.t&&rd.t[k]||0,lt=t[k]||0,rv=rd&&rd[k];
    if(rv!=null&&rt>lt){orig.call(localStorage,k,rv);t[k]=rt;restored=true}
    else if(localStorage.getItem(k)!=null&&(lt>rt||rv==null)){if(!t[k])t[k]=Date.now();needPush=true}});
   setT(t);ready=true;
   if(restored&&typeof window.onSyncRestored==='function')window.onSyncRestored();
   if(needPush)push();
  }catch(e){ready=true}
 }
 start();
})();

/* ===== ランキングデータ（2026/11/18発表ベース。21位以下は一部概算） ===== */

["モロッコ","🇲🇦",1809.37],["ポルトガル","🇵🇹",1800.10],["ブラジル","🇧🇷",1796.80],["ベルギー","🇧🇪",1790.37],

["メキシコ","🇲🇽",1723.64],["イタリア","🇮🇹",1717.20],["クロアチア","🇭🇷",1714.22],["アメリカ","🇺🇸",1713.56],
["日本","🇯🇵",1684.61],["セネガル","🇸🇳",1648.84],["ノルウェー","🇳🇴",1643.59],["ウルグアイ","🇺🇾",1640.00],

["チリ","🇨🇱",1456.40]
].map(([name,flag,pts])=>({name,flag,pts}));
const START_PTS=1440, K=50;

/* ===== エンブレム ===== */
const DEF_CREST={c1:'#1d4ed8',c2:'#ffffff',txt:'AFC'};
const C1S=['#1d4ed8','#0ea5e9','#c60b1e','#f97316','#facc15','#16a34a','#7c3aed','#111827','#ffffff'];
const C2S=['#ffffff','#facc15','#111827','#c60b1e','#1d4ed8'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function crest(sz=40,c){c=c||S.crest||DEF_CREST;const t=esc(c.txt||'');const fs=[...(c.txt||'')].length>=3?10:13;
 return `<svg width="${sz}" height="${Math.round(sz*1.15)}" viewBox="0 0 40 46" aria-hidden="true"><path d="M4 3h32v20c0 11-7 18-16 21C11 41 4 34 4 23z" fill="${c.c1}" stroke="#0005" stroke-width="2.5"/><path d="M4 3h32v20c0 11-7 18-16 21C11 41 4 34 4 23z" fill="none" stroke="${c.c2}" stroke-width="1.2"/><path d="M8 7h24v16c0 8-5 13.5-12 16-7-2.5-12-8-12-16z" fill="none" stroke="${c.c2}" stroke-width="1.2"/><text x="20" y="26.5" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="${fs}" fill="${c.c2}">${t}</text></svg>`}
const crestInline=sz=>`<span class="crest" style="display:inline-block;vertical-align:middle">${crest(sz)}</span>`;

/* ===== 便利関数 ===== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const mk=s=>esc(s).replace(/【(.*?)】/g,'<span class="mk">$1</span>');

/* ===== ことわざ・四字熟語プール =====
 [ことば, 意味, レベル(1〜3), 種類(こ=ことわざ等/四=四字熟語), 同じ意味グループ] */
const POOL=[
["猿も木から落ちる","名人でも、ときには失敗することがある",1,"こ","a"],
["石の上にも三年","がまん強く続ければ、いつかはうまくいく",1,"こ"],
["急がば回れ","急ぐときこそ、遠回りでも安全で確かな方法をとるほうがよい",1,"こ"],
["花より団子","見た目の美しさより、実際に役に立つものを選ぶ",1,"こ"],
["早起きは三文の徳","朝早く起きると、何かよいことがある",1,"こ"],
["犬も歩けば棒に当たる","出歩くと、思いがけない災難や幸運にあうことがある",1,"こ"],
["七転び八起き","何度失敗しても、くじけずに立ち上がる",1,"こ"],
["三人寄れば文殊の知恵","ふつうの人でも、三人集まって相談すればよい考えが出る",1,"こ"],

function poolQ(tier,used){
  let c=POOL.filter(p=>p.l<=tier&&!used.has(p.w));
  if(tier>=3){const h=c.filter(p=>p.l>=2);if(h.length)c=h}
  if(!c.length)c=POOL.filter(p=>p.l<=tier);
  const p=pick(c);used.add(p.w);
  const others=shuffle(POOL.filter(o=>o.k===p.k&&o.g!==p.g)).filter((o,i,a)=>a.findIndex(x=>x.m===o.m)===i);
  const nm=p.k==='四'?'四字熟語':'ことわざ';
  const rev=R(0,2)===0;
  if(!rev){
    const w=others.filter(o=>o.m!==p.m).slice(0,3).map(o=>o.m);
    return mkQ({q:`「${p.w}」の意味は？`,a:p.m,w,t:tier>=3?14:16,tag:nm,exp:`「${p.w}」＝${p.m}`});
  }
  const w=others.slice(0,3).map(o=>o.w);
  return mkQ({q:`「${p.m}」という意味の${nm}は？`,a:p.w,w,t:tier>=3?14:16,tag:nm,exp:`「${p.w}」＝${p.m}`});
}
function mkQ({q,a,w,t,tag,psg,exp,kanji}){const ch=shuffle([a,...w]);return {q,psg,choices:ch,ans:ch.indexOf(a),aText:a,t,tag,exp,kanji}}

const LV_NAME=['とてもやさしい','やさしい','ふつう','むずかしい','とてもむずかしい'];
const LV_T=[1.6,1.3,1.0,0.9,0.8];
function stageQ(si,used){
  const st=STAGES[si],n=st.qs.length,L=effLv(),span=Math.ceil(n*0.6);
  let idx=[...Array(n).keys()];
  if(L<=2)idx=idx.slice(0,span);else if(L>=4)idx=idx.slice(n-span);
  let c=idx.filter(i=>!used.has(i));if(!c.length)c=[...Array(n).keys()].filter(i=>!used.has(i));if(!c.length)c=[...Array(n).keys()];
  const i=pick(c);used.add(i);const it=st.qs[i];
  return mkQ({q:it.q,a:it.a,w:it.w,t:st.t,psg:it.psg,kanji:it.kanji,tag:null});
}

  halfLab.textContent=M.phase==='pk'?`PK戦 ${M.pkI+1}本目（成功 ${M.pkMy}）`:(M.i<5?'前半':'後半')+` ・ ${M.i+1}問目`;
  qlab.innerHTML=`じっくり考えてOK`+(q.tag?`<span class="qtag">${q.tag}</span>`:'');
  psg.innerHTML=q.psg?`<div class="psg">${esc(q.psg)}</div>`:'';
  document.getElementById('q').innerHTML=q.q;
  hint.className='hint';hint.textContent='';
  comm.textContent='';renderDots();renderChoices();startTimer(q.limit);
}
function renderDots(){
  let h='';for(let k=0;k<10;k++){const r=M.res[k];h+=`<i class="${r===1?'ok':r===0?'ng':(k===M.i&&M.phase==='reg'?'now':'')}"></i>`}dots.innerHTML=h;
}
function renderChoices(){
  const q=M.q,short=q.kanji||q.choices.every(c=>[...c].length<=3);
  choices.className='choices'+(short?' kanji':'');
  choices.innerHTML=q.choices.map((c,i)=>`<button data-i="${i}"><span class="k">${i+1}</span><span>${esc(c)}</span></button>`).join('');
}
choices.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)judge(+b.dataset.i,false)});
document.addEventListener('keydown',e=>{
  if(!document.getElementById('match').classList.contains('on')||over.classList.contains('on')||!M)return;
  if(/^[1-4]$/.test(e.key)){e.preventDefault();judge(+e.key-1,false)}
  else if(e.key==='Enter'){const n=document.getElementById('nx');if(n){e.preventDefault();n.click()}}
});
function startTimer(sec){
  clearInterval(TI);const end=Date.now()+sec*1000;M.qStart=Date.now();if(!M.t0)M.t0=Date.now();
  tbar.style.width='0%';
}
function judge(idx,timeout){
  if(!M||M.locked)return;M.locked=true;clearInterval(TI);
  const pk=M.phase==='pk',ok=idx===M.q.ans;
  if(!pk){const used=timeout?M.q.limit:Math.min(M.q.limit,(Date.now()-M.qStart)/1000);M.times.push(used);M.ratios.push(used/M.q.limit);if(timeout)M.tos++}
  const btns=choices.querySelectorAll('button');
  btns.forEach((b,i)=>{b.disabled=true;if(i===M.q.ans)b.classList.add('right');else if(i===idx)b.classList.add('wrong');else b.classList.add('dim')});
  if(ok){
    if(pk)M.pkMy++;else{M.my++;M.res[M.i]=1}
    comm.textContent=pick(CM_OK);ball.style.left='96%';
    goaltxt.classList.remove('go');void goaltxt.offsetWidth;goaltxt.classList.add('go');
  }else{
    if(!pk){M.op++;M.res[M.i]=0}
    M.missed.push(M.q);
    comm.textContent=timeout?'時間切れ！相手ボールに…':(pk?'PK失敗…':pick(CM_NG));ball.style.left=pk?'50%':'4%';
    if(M.q.exp){hint.className='hint exp';hint.textContent=M.q.exp}
  }
  sMy.textContent=M.my;sOp.textContent=M.op;renderDots();
  const adv=()=>{ball.style.left='50%';if(pk)M.pkI++;else M.i++;nextQ()};
  if(ok)setTimeout(adv,1000);
  else{const nb=document.createElement('button');nb.className='nextbtn';nb.id='nx';nb.textContent='つぎへ ▶';nb.onclick=adv;choices.appendChild(nb);nb.scrollIntoView({block:'nearest'})}
}
function quitMatch(){overlay(`<h3>試合をやめる？</h3><p class="mut">この試合は記録されません。</p><div class="row" style="justify-content:center"><button class="btn" onclick="closeOver()">つづける</button><button class="btn pri" onclick="clearInterval(TI);hubAddTime();M=null;closeOver();goHome()">やめる</button></div>`)}
function plain(h){return h.replace(/<br>/g,' ').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'")}
function finish(){
  hubLog();hubAddTime();
  clearInterval(TI);
  const o=M.opp,before=S.pts,rb=rankOf(before);
  let res=M.my>M.op?'win':M.my<M.op?'loss':(M.pkMy>=2?'pkwin':'pkloss');
  const W={win:1,pkwin:.75,pkloss:.5,loss:0}[res];
  const We=1/(Math.pow(10,-(before-o.pts)/600)+1);
  let dlt=K*(W-We);if(dlt<0)dlt*=.5;dlt=Math.round(dlt*100)/100;
  let boost=false;if(dlt>0&&hubIsBehind()){dlt=Math.round(dlt*1.2*100)/100;boost=true}hubMark();
  S.pts=Math.round((before+dlt)*100)/100;const ra=rankOf(S.pts);
  const won=res==='win'||res==='pkwin';
  const sc=`${M.my}-${M.op}`+(M.phase==='pk'?`（PK ${M.pkMy}/${M.pkI}）`:'');
  if(won){S.cleared[M.si]=true;const prev=S.best[M.si];const cur=M.my-M.op;if(!prev||cur>(+prev.split('-')[0]-+prev.split('-')[1]))S.best[M.si]=`${M.my}-${M.op}`}
  const nq=M.times.length,acc=M.res.filter(x=>x===1).length/Math.max(1,nq);
  const avgT=M.times.reduce((a,b)=>a+b,0)/Math.max(1,nq),avgR=M.ratios.reduce((a,b)=>a+b,0)/Math.max(1,nq);
  const lvBefore=S.lv;let lvMsg='';
  if(acc>=0.9&&avgR<0.45)S.lv=Math.min(5,S.lv+1);
  else if(acc<=0.3)S.lv=Math.max(1,S.lv-2);
  else if(acc<=0.5||M.tos>=3||(acc<0.7&&avgR>0.75))S.lv=Math.max(1,S.lv-1);
  if(S.lv>lvBefore)lvMsg=`余裕があったので、つぎはレベルアップ！（${LV_NAME[S.lv-1]}）`;
  else if(S.lv<lvBefore)lvMsg=`つぎは少しやさしくするよ（${LV_NAME[S.lv-1]}）。問題をやさしめにするね`;
  else lvMsg=`ちょうどいいレベル。このまま（${LV_NAME[S.lv-1]}）`;
  save();
  const passed=TEAMS.filter(t=>t.pts<=S.pts&&t.pts>before);
  const title={win:'🏆 勝利！',pkwin:'🏆 PK戦で勝利！',pkloss:'😣 PK戦で負け…',loss:'😢 負け…'}[res];
  let h=`<h2>${title}</h2><div class="mut">vs ${o.flag} ${o.name}（FIFAランク${M.orank}位）</div><div class="big">${sc}</div>
  <div class="delta ${dlt>=0?'up':'down'}">${dlt>=0?'+':''}${dlt.toFixed(2)} pt${boost?' 🚀追い上げ×1.2':''}</div>
  <div style="margin-top:6px">世界ランキング <b>${rb}位 → ${ra}位</b>${ra<rb?' ⬆️':''}</div>`;
  if(passed.length)h+=`<div class="mut" style="margin-top:4px">${passed.map(t=>t.flag+t.name).join('、')} をぬいた！</div>`;
  if(ra===1&&rb!==1)h+=`<div class="big" style="font-size:26px;color:var(--g1)">🌍 世界ランキング1位！</div>`;
  if(won&&M.si<STAGES.length-1&&!S.best[M.si+1])h+=`<div class="mut" style="margin-top:6px">ステージ${M.si+2}「${STAGES[M.si+1].name}」がひらいた！</div>`;
  if(won&&M.si===STAGES.length-1)h+=`<div class="big" style="font-size:24px;color:#7c3aed">🏆 決勝で勝利！ワールドカップ優勝！</div>`;
  if(!won)h+=`<div class="mut" style="margin-top:6px">相手より多くゴールすれば勝ち。もう一度チャレンジ！</div>`;
  const no=oppFor(S.pts);h+=`<div class="mut" style="margin-top:8px">つぎのあいて：${no.flag} ${no.name}（${realRank(no)}位）</div>`;
  h+=`<div class="stat"><span>正答率 <b>${Math.round(acc*100)}%</b></span></div><div style="margin-top:6px"><span class="lvtag">レベル ${S.lv}</span> ${lvMsg}</div>`;
  if(M.missed.length)h+=`<div class="miss"><b>ふりかえり（まちがえた問題）</b>${M.missed.map(q=>`<div>${q.psg?'<span class="me">（読解）</span> ':''}${esc(plain(q.q))}<br>→ <span class="ma">${esc(q.aText)}</span>${q.exp?`<br><span class="me">${esc(q.exp)}</span>`:''}</div>`).join('')}</div>`;
  else h+=`<div style="margin-top:8px;font-weight:800;color:var(--g1)">パーフェクト！ノーミス！</div>`;
  resBox.innerHTML=h;M=null;show('result');
}

load();
/* 2026/11/22 時点の記録を反映（1回だけ） */
if(!S.seedV2){S.pts=Math.max(S.pts,1496);S.cleared=S.cleared||{};for(let i=0;i<2;i++)S.cleared[i]=true;S.seedV2=true;save()}
renderHome();
window.onSyncRestored=()=>{if(!M){load();renderHome()}};
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));</script>
